<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --text: #111111;
            --transition-speed: 0.6s;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: var(--bg);
            color: var(--text);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            transition: background var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1),
                        color var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('image/b1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.5;
            z-index: -1;
            transition: opacity var(--transition-speed) ease;
            pointer-events: none;
        }

        body.dark::before {
            opacity: 0.5;
            filter: brightness(0.6) grayscale(0.2);
        }

        body.dark {
            --bg: #1e1e1e;
            --text: #e0e0e0;
        }

        .toggle-wrap {
            position: fixed;
            top: 32px;
            left: 32px;
            z-index: 100;
        }

        .toggle-track {
            position: relative;
            width: 160px;
            height: 64px;
            border-radius: 999px;
            background: #8a8fa8;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.25),
                        inset 0 -2px 6px rgba(255, 255, 255, 0.12),
                        0 2px 8px rgba(0, 0, 0, 0.3);
            transition: background var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            user-select: none;
        }

        body.dark .toggle-track {
            background: #2e2e2e;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.5),
                        inset 0 -2px 6px rgba(255, 255, 255, 0.04),
                        0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .toggle-label {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 17px;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.04em;
            pointer-events: none;
            transition: opacity 0.3s ease, left 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }

        .label-light {
            left: 72px;
            opacity: 1;
        }

        .label-dark {
            left: 20px;
            opacity: 0;
        }

        body.dark .label-light {
            opacity: 0;
        }

        body.dark .label-dark {
            opacity: 1;
        }

        .toggle-knob {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(145deg, #9ea3b8, #7a7f96);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35),
                        0 1px 4px rgba(0, 0, 0, 0.2),
                        inset 0 1px 3px rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.5s ease;
            z-index: 3;
        }

        body.dark .toggle-knob {
            left: 100px;
            background: linear-gradient(145deg, #3a3a3a, #2a2a2a);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6),
                        0 1px 4px rgba(0, 0, 0, 0.4),
                        inset 0 1px 3px rgba(255, 255, 255, 0.08);
        }

        .knob-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            transition: opacity 0.3s ease;
        }

        .icon-sun,
        .icon-moon {
            position: absolute;
            transition: opacity 0.3s ease;
        }

        .icon-sun {
            opacity: 1;
        }

        .icon-moon {
            opacity: 0;
        }

        body.dark .icon-sun {
            opacity: 0;
        }

        body.dark .icon-moon {
            opacity: 1;
        }

        .icon-sun svg,
        .icon-moon svg {
            width: 26px;
            height: 26px;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.6));
        }

        .page-content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        .text-box {
            width: 520px;
            min-height: 200px;
            border: 2px solid #111;
            border-radius: 0;
            padding: 20px 22px;
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            background: transparent;
            transition: border-color 0.3s ease;
        }

        body.dark .text-box {
            border-color: #ddd;
        }

        .custom-select {
            position: relative;
            font-family: 'Space Mono', monospace;
            font-size: 13px;
        }

        .select-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: 1.5px solid #111;
            border-radius: 4px;
            background: transparent;
            color: var(--text);
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: background 0.2s ease;
            white-space: nowrap;
        }

        body.dark .select-btn {
            border-color: #ddd;
        }

        .select-btn:hover {
            background: rgba(128, 128, 128, 0.08);
        }

        .select-btn .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
            font-size: 10px;
            opacity: 0.6;
        }

        .select-btn.open .arrow {
            transform: rotate(180deg);
        }

        .select-dropdown {
            margin-top: 6px;
            background: transparent;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            pointer-events: none;
            transition: max-height 0.3s ease, opacity 0.25s ease;
        }

        .select-dropdown.open {
            max-height: 200px;
            opacity: 1;
            pointer-events: all;
        }

        .select-option {
            padding: 10px 16px;
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            color: var(--text);
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: background 0.15s ease;
        }

        .select-option:hover {
            background: rgba(128, 128, 128, 0.1);
        }

        .text-box-inner {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
        }

        .text-box-inner.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .box-text {
            flex: 1;
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            color: var(--text);
            letter-spacing: 0.04em;
            transition: opacity 0.3s ease;
        }

        .box-text.done {
            opacity: 0.3;
            text-decoration: line-through;
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid #111;
            border-radius: 4px;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease, border-color 0.3s ease;
            background: transparent;
        }

        body.dark .checkbox {
            border-color: #ddd;
        }

        .checkbox.checked {
            background: #3ddc84;
            border-color: #3ddc84;
        }

        .checkbox svg {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .checkbox.checked svg {
            opacity: 1;
        }

        .keys-row {
            display: flex;
            gap: 20px;
        }

        .key {
            width: 150px;
            height: 150px;
            border-radius: 20px;
            background: var(--bg);
            border: 2.5px solid #111;
            box-shadow: 0 7px 0 0 #111;
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: box-shadow 0.08s ease, transform 0.08s ease;
        }

        .key::before {
            content: '';
            position: absolute;
            inset: 10px;
            border-radius: 12px;
            background: color-mix(in srgb, var(--bg) 60%, #888 40%);
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.15),
                        inset 0 -1px 3px rgba(255, 255, 255, 0.5);
        }

        .key:active {
            transform: translateY(6px);
            box-shadow: 0 1px 0 0 #111;
        }

        body.dark .key {
            border-color: #bbb;
            box-shadow: 0 7px 0 0 #bbb;
        }

        body.dark .key::before {
            background: color-mix(in srgb, #1e1e1e 60%, #555 40%);
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.4),
                        inset 0 -1px 3px rgba(255, 255, 255, 0.06);
        }

        body.dark .key:active {
            box-shadow: 0 1px 0 0 #bbb;
        }

        #typeField {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            color: var(--text);
            letter-spacing: 0.04em;
            caret-color: var(--text);
        }

        #typeField::placeholder {
            color: rgba(128, 128, 128, 0.45);
        }

        .back-btn {
            position: fixed;
            top: 36px;
            right: 36px;
            background: none;
            border: 1px solid rgba(128, 128, 128, 0.3);
            color: var(--text);
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            padding: 8px 18px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.08em;
        }

        .back-btn:hover {
            background: rgba(128, 128, 128, 0.15);
        }
    </style>
</head>
<body>
    <div class="toggle-wrap">
        <div class="toggle-track" id="toggleTrack">
            <span class="toggle-label label-light">Light</span>
            <span class="toggle-label label-dark">Dark</span>
            <div class="toggle-knob" id="toggleKnob">
                <div class="knob-icon">
                    <div class="icon-sun">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
                            <circle cx="12" cy="12" r="4" fill="white" stroke="none" />
                            <line x1="12" y1="2" x2="12" y2="5" />
                            <line x1="12" y1="19" x2="12" y2="22" />
                            <line x1="2" y1="12" x2="5" y2="12" />
                            <line x1="19" y1="12" x2="22" y2="12" />
                            <line x1="4.22" y1="4.22" x2="6.34" y2="6.34" />
                            <line x1="17.66" y1="17.66" x2="19.78" y2="19.78" />
                            <line x1="4.22" y1="19.78" x2="6.34" y2="17.66" />
                            <line x1="17.66" y1="6.34" x2="19.78" y2="4.22" />
                        </svg>
                    </div>
                    <div class="icon-moon">
                        <svg viewBox="0 0 24 24" fill="white" stroke="none">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="back-btn" onclick="history.back()">← back</button>

    <div class="page-content">
        <div class="text-box" id="textBox">
            <div class="text-box-inner" id="textBoxInner">
                <span class="box-text" id="boxText">So much to do, yet I act as if it’s all done.</span>
                <div class="checkbox" id="checkbox">
                    <svg width="13" height="10" viewBox="0 0 13 10" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="1.5 5 5 8.5 11.5 1.5" />
                    </svg>
                </div>
            </div>
            <div class="text-box-inner" id="selectInner" style="flex-direction: column; align-items: flex-start;">
                <div class="custom-select" id="customSelect" style="width:100%;">
                    <button class="select-btn" id="selectBtn">
                        <span id="selectLabel">select</span>
                        <span class="arrow">▼</span>
                    </button>
                    <div class="select-dropdown" id="selectDropdown">
                        <div class="select-option" data-value="vanish">I don’t want to make a choice</div>
                        <div class="select-option" data-value="remain">I wish to avoid choosing</div>
                        <div class="select-option" data-value="silence">I refuse to choose</div>
                    </div>
                </div>
            </div>
            <div class="text-box-inner" id="typeInner">
                <input type="text" id="typeField" placeholder="type anything..." autocomplete="off" />
            </div>
        </div>
        <div class="keys-row">
            <div class="key key-1" id="key1"></div>
            <div class="key key-2" id="key2"></div>
            <div class="key key-3" id="key3"></div>
        </div>
    </div>

    <script>
        const track = document.getElementById('toggleTrack');
        let isDark = false;
        track.addEventListener('click', () => {
            isDark = !isDark;
            document.body.classList.toggle('dark', isDark);
        });

        const key1 = document.getElementById('key1');
        const textBoxInner = document.getElementById('textBoxInner');
        const checkbox = document.getElementById('checkbox');
        const boxText = document.getElementById('boxText');
        let textVisible = false;

        key1.addEventListener('click', () => {
            if (!textVisible) {
                selectInner.classList.remove('visible');
                selectVisible = false;
                textVisible = true;
                textBoxInner.classList.add('visible');
            }
        });

        checkbox.addEventListener('click', () => {
            checkbox.classList.add('checked');
            boxText.classList.add('done');
            setTimeout(() => {
                textBoxInner.classList.remove('visible');
                setTimeout(() => {
                    checkbox.classList.remove('checked');
                    boxText.classList.remove('done');
                    textVisible = false;
                }, 400);
            }, 600);
        });

        const key2 = document.getElementById('key2');
        const selectInner = document.getElementById('selectInner');
        const selectBtn = document.getElementById('selectBtn');
        const selectDropdown = document.getElementById('selectDropdown');
        const selectLabel = document.getElementById('selectLabel');
        let selectVisible = false;

        key2.addEventListener('click', () => {
            if (!selectVisible) {
                textBoxInner.classList.remove('visible');
                textVisible = false;
                selectVisible = true;
                selectInner.classList.add('visible');
            }
        });

        selectBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = selectDropdown.classList.contains('open');
            selectDropdown.classList.toggle('open', !isOpen);
            selectBtn.classList.toggle('open', !isOpen);
        });

        document.querySelectorAll('.select-option').forEach(opt => {
            opt.addEventListener('click', () => {
                selectDropdown.classList.remove('open');
                selectBtn.classList.remove('open');
                selectInner.style.transition = 'opacity 0.4s ease';
                selectInner.style.opacity = '0';
                setTimeout(() => {
                    selectInner.classList.remove('visible');
                    selectInner.style.opacity = '';
                    selectInner.style.transition = '';
                    selectLabel.textContent = 'select';
                    selectVisible = false;
                }, 400);
            });
        });

        document.addEventListener('click', () => {
            selectDropdown.classList.remove('open');
            selectBtn.classList.remove('open');
        });

        const key3 = document.getElementById('key3');
        const typeInner = document.getElementById('typeInner');
        const typeField = document.getElementById('typeField');
        let typeVisible = false;
        let typeTimer = null;

        key3.addEventListener('click', () => {
            if (!typeVisible) {
                textBoxInner.classList.remove('visible');
                textVisible = false;
                selectInner.classList.remove('visible');
                selectVisible = false;
                typeVisible = true;
                typeInner.classList.add('visible');
                setTimeout(() => typeField.focus(), 400);
            }
        });

        typeField.addEventListener('input', () => {
            clearTimeout(typeTimer);
            typeTimer = setTimeout(() => {
                typeInner.style.transition = 'opacity 0.6s ease';
                typeInner.style.opacity = '0';
                setTimeout(() => {
                    typeInner.classList.remove('visible');
                    typeInner.style.opacity = '';
                    typeInner.style.transition = '';
                    typeField.value = '';
                    typeVisible = false;
                }, 600);
            }, 2000);
        });
    </script>
</body>
</html>
